<section id="achievements" class="section alt-bg">
  <div class="container">
    <div class="section-header">
      <span class="section-tag">Achievements</span>
      <h2 class="section-title">Awards &amp; Certifications</h2>
      <p>Milestones I'm proud of along the way.</p>
    </div>

    <div class="grid achievements-grid">
      <div class="card achievement-card" *ngFor="let a of achievements">
        <div class="emoji">{{ a.emoji }}</div>
        <h4>{{ a.title }}</h4>
        <p class="issuer">{{ a.issuer }} · {{ a.year }}</p>
        <p>{{ a.desc }}</p>
      </div>
    </div>
  </div>
</section>
